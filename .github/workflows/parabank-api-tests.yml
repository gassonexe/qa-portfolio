name: ParaBank API Tests
on:
  push:
    branches: [main]
    paths:
      - 'banking-app-testing/api-tests/**'
      - '.github/workflows/parabank-api-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'banking-app-testing/api-tests/**'
      - '.github/workflows/parabank-api-tests.yml'
  workflow_dispatch:

jobs:
  api-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banking-app-testing/api-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: banking-app-testing/api-tests/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Postman collection with Newman
        env:
          PARABANK_USERNAME: ${{ secrets.PARABANK_USERNAME }}
          PARABANK_PASSWORD: ${{ secrets.PARABANK_PASSWORD }}
          PARABANK_CUSTOMER_ID: ${{ vars.PARABANK_CUSTOMER_ID }}
        run: npm test
      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: parabank-api-results
          path: banking-app-testing/api-tests/results/
          retention-days: 14
