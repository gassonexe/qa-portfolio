name: Yettel Webshop Playwright Tests
on:
  push:
    branches: [main]
    paths:
      - 'yettel-webshop-playwright/**'
      - '.github/workflows/yettel-webshop-playwright.yml'
  pull_request:
    branches: [main]
    paths:
      - 'yettel-webshop-playwright/**'
      - '.github/workflows/yettel-webshop-playwright.yml'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yettel-webshop-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: yettel-webshop-playwright/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Type-check
        run: npm run typecheck
      - name: Run Playwright tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            yettel-webshop-playwright/playwright-report/
            yettel-webshop-playwright/test-results/
          retention-days: 30
